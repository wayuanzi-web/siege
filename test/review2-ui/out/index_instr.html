<style>
/* 版面：橫向的戰場佔滿整個舞台，資訊列與選單蓋在上面。手機直拿時整個舞台轉 90 度，所以尺寸一律用 --u（舞台高度的 1%）來算。 */
@font-face { font-family: "NumFB"; font-weight: 400; src: local("Arial Black"), local("Arial-Black"), local("Roboto Black"), local("Roboto-Black"), local("HelveticaNeue-CondensedBlack"), local("DejaVu Sans Bold"), local("DejaVuSans-Bold"), local("Arial Bold"), local("Arial-BoldMT"); }
:root {
  color-scheme: dark;

  --gold: #ffc93c; --gold-lt: #fff0b0; --gold-deep: #b9790f; --gold-ink: #3a2203;
  --f-display: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-num: "Lilita One", "NumFB", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --cut: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; overflow: hidden; background: var(--ink); }
body { height: 100%; margin: 0; background: var(--ink); color: var(--bone); font-family: var(--f-body); overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #fff; outline-offset: -4px; }
.btn-gold:focus-visible, .seg button[aria-pressed="true"]:focus-visible { outline-color: var(--ink); }
.skill:focus-visible { outline-offset: 3px; }
#app { position: relative; height: 100%; overflow: hidden; background: #07060c; }
#stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; overflow: hidden; background: #0d1019;
  --u: 3.9px; --w: 7px; --pl: 0px; --pr: 0px; font-size: calc(var(--u) * 3.7); line-height: 1.4; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chamfer { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }

/* ---------- 戰鬥中的資訊列 ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: calc(var(--u) * 2.2);
  padding: calc(var(--u) * 1.6) calc(var(--u) * 2.6 + var(--pr)) calc(var(--u) * 3.4) calc(var(--u) * 2.2 + var(--pl));
  background: linear-gradient(180deg, rgba(14, 10, 26, .82), rgba(14, 10, 26, .5) 62%, rgba(14, 10, 26, 0)); }
#btnPause { pointer-events: auto; width: max(calc(var(--u) * 10.4), 40px); height: max(calc(var(--u) * 10.4), 40px); display: grid; place-items: center; background: rgba(255, 255, 255, .12); --cut: calc(var(--u) * 1.8); }
#btnPause i { display: block; width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.6); border-left: calc(var(--u) * 1.1) solid var(--bone); border-right: calc(var(--u) * 1.1) solid var(--bone); }
.side { display: flex; align-items: center; gap: calc(var(--u) * 1.6); min-width: 0; }
.crew { display: flex; gap: calc(var(--u) * 0.8); flex: none; }
.cu { position: relative; width: calc(var(--u) * 7.6); height: calc(var(--u) * 7.6); border-radius: 50%; overflow: hidden; background: #241d3c; box-shadow: 0 0 0 calc(var(--u) * .45) var(--blue); }
.foe .cu { box-shadow: 0 0 0 calc(var(--u) * .45) var(--red); }
.cu canvas { position: absolute; left: -32%; top: -18%; width: 164%; height: 164%; }
.cu.frozen { box-shadow: 0 0 0 calc(var(--u) * .6) #a8e8ff; } .cu.frozen::after { content: ""; position: absolute; inset: 0; background: rgba(150, 220, 255, .5); }
.cu.stun { box-shadow: 0 0 0 calc(var(--u) * .6) #ffe14a; } .cu.stun::after { content: ""; position: absolute; inset: 0; background: rgba(255, 225, 74, .35); }
.cu.dead { box-shadow: 0 0 0 calc(var(--u) * .45) #4a4560; } .cu.dead canvas { filter: grayscale(1) brightness(.5); }
.cu.dead::before, .cu.dead::after { content: ""; position: absolute; left: 12%; right: 12%; top: 44%; height: 12%; background: #ff5a48; transform: rotate(45deg); z-index: 1; border-radius: 2px; }
.cu.dead::after { transform: rotate(-45deg); }
.hpbar { position: relative; flex: 1; min-width: 0; height: calc(var(--u) * 5.2); background: rgba(8, 5, 16, .78); box-shadow: 0 0 0 calc(var(--u) * .4) rgba(10, 6, 20, .9); --cut: calc(var(--u) * 1.3); }
.hpbar i { position: absolute; inset: 0; transform-origin: 0 50%; background: linear-gradient(180deg, #9cc8ff, var(--blue) 55%, #1b46b8); transition: transform .18s ease-out; }
.foe .hpbar i { transform-origin: 100% 50%; background: linear-gradient(180deg, #ffa08c, var(--red) 55%, #8f1418); }
.hpbar b { position: absolute; left: calc(var(--u) * 1.6); top: 50%; transform: translateY(-50%); font-family: var(--f-num); font-weight: 400; font-size: calc(var(--u) * 4.1); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 calc(var(--u) * .35) 0 rgba(0, 0, 0, .55); }
.foe .hpbar b { left: auto; right: calc(var(--u) * 1.6); }
.hpbar small { position: absolute; right: calc(var(--u) * 1.6); top: 50%; transform: translateY(-50%); font-size: calc(var(--u) * 2.7); letter-spacing: .14em; opacity: .9; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
.foe .hpbar small { right: auto; left: calc(var(--u) * 1.6); }
.hpbar .tick { position: absolute; bottom: 0; height: 34%; width: calc(var(--u) * .6); margin-right: calc(var(--u) * -.3); background: rgba(255, 240, 176, .95); }
.hpbar b, .hpbar small { z-index: 1; }
.hpbar.hit i { filter: brightness(1.8); }
.vs { display: grid; justify-items: center; gap: calc(var(--u) * .3); min-width: calc(var(--u) * 20); text-align: center; }
.vs b { font-family: var(--f-display); font-weight: 900; font-size: calc(var(--u) * 3.9); letter-spacing: .1em; line-height: 1.1; white-space: nowrap; text-shadow: 0 2px 3px rgba(0, 0, 0, .7); }
.vs .sub { display: flex; align-items: center; gap: calc(var(--u) * 2); font-size: calc(var(--u) * 2.9); letter-spacing: .08em; color: var(--mute); white-space: nowrap; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
#roundTxt { color: var(--bone); font-variant-numeric: tabular-nums; }
#windBox { display: flex; align-items: center; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 2.9); letter-spacing: .06em; color: var(--gold-lt); white-space: nowrap; font-variant-numeric: tabular-nums; }
#windBox i { display: block; width: calc(var(--u) * 6); height: calc(var(--u) * 2.2); background: var(--gold); clip-path: polygon(0 32%, 62% 32%, 62% 0, 100% 50%, 62% 100%, 62% 68%, 0 68%); transition: transform .5s ease; }
#windBox.calm i { opacity: .25; }
.hud-bot { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 2) calc(var(--u) * 1.5 + var(--pr)) calc(var(--u) * 2) calc(var(--u) * 2 + var(--pl)); }
.aimbox { grid-column: 1; display: flex; align-items: flex-end; gap: calc(var(--u) * 1.6); justify-self: start; }
#btnFire { pointer-events: auto; min-height: max(calc(var(--u) * 11), 42px); min-width: max(calc(var(--u) * 19), 64px); padding: calc(var(--u) * 1) calc(var(--u) * 3.4); font-family: var(--f-display); font-weight: 900; font-size: calc(var(--u) * 4.4); letter-spacing: .2em; text-indent: .2em; --cut: calc(var(--u) * 1.8); opacity: .5; }
#btnFire.ready { opacity: 1; }
#turnChip { grid-column: 2; justify-self: center; align-self: end; margin-bottom: calc(var(--u) * .6); padding: calc(var(--u) * .9) calc(var(--u) * 3); font-weight: 700; font-size: calc(var(--u) * 3.3); letter-spacing: .1em; white-space: nowrap; background: rgba(14, 10, 26, .78); color: var(--bone); --cut: calc(var(--u) * 1.4); }
#turnChip.me { color: #d6e8ff; box-shadow: inset 0 0 0 2px var(--blue); }
#turnChip.me.go { color: #0c2466; background: linear-gradient(180deg, #d9ecff, #7fb4ff); box-shadow: none; animation: chip .8s ease-in-out infinite alternate; }
#turnChip.foe { color: #ffc4b8; box-shadow: inset 0 0 0 2px var(--red); }
#turnChip.foe.warn { color: #fff; background: rgba(170, 20, 20, .92); box-shadow: inset 0 0 0 2px #ffb0a0; }
#turnChip.hz { color: #ffe0a0; box-shadow: inset 0 0 0 2px var(--gold); }
@keyframes chip { from { transform: translateY(0); } to { transform: translateY(calc(var(--u) * -.8)); } }
#aimInfo { display: flex; gap: calc(var(--u) * 2.4); padding: calc(var(--u) * .8) calc(var(--u) * 2); font-size: calc(var(--u) * 2.9); letter-spacing: .1em; color: var(--mute); background: rgba(14, 10, 26, .6); --cut: calc(var(--u) * 1.4); }
#aimInfo b { font-family: var(--f-num); font-weight: 400; font-size: calc(var(--u) * 3.8); color: var(--bone); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.skills { grid-column: 3; display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); justify-self: end; }
.skill { pointer-events: auto; position: relative; width: calc(var(--u) * 15.5); height: calc(var(--u) * 15.5); border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--blue-lt) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .16) 0); filter: drop-shadow(0 calc(var(--u) * .8) 0 rgba(0, 0, 0, .5)); }
.skill::before { content: ""; position: absolute; inset: calc(var(--u) * 1.25); border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3b3260, #191428); }
.skill span { position: relative; font-family: var(--f-display); font-weight: 900; font-size: calc(var(--u) * 4); letter-spacing: .06em; color: var(--mute); line-height: 1.1; text-align: center; }
.skill small { display: block; font-family: var(--f-num); font-weight: 400; font-size: calc(var(--u) * 2.8); letter-spacing: 0; }
.skill.gold { background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .16) 0); }
.skill.ready { animation: skill .7s ease-in-out infinite alternate; }
.skill.ready::before { background: radial-gradient(circle at 50% 35%, #d9ecff, #5aa2ff 60%, #1b46b8); }
.skill.ready span { color: #0c2466; }
.skill.gold.ready::before { background: radial-gradient(circle at 50% 35%, #fff0b0, #ffb81f 60%, #b9790f); }

.skill.on::before { background: radial-gradient(circle at 50% 35%, #ffffff, #bfe0ff 70%); } .skill.on span { color: #0c2466; }

/* ===== 35-scene: 佈景的共用工具與組裝。每個場景自己一個檔（36-*.js），在 THEMES 裡登記 =====
   一個場景是一個物件：
     build(c, W, H)   畫靜態的遠景（天空、山…），只在進關卡或畫面大小改變時畫一次

// 一條由幾個正弦疊起來的稜線，回傳 f(x) ∈ 約 [-1, 1]
function ridgeFn(R, f0) {
  const p = [R() * TAU, R() * TAU, R() * TAU, R() * TAU];
  return (x) => Math.sin(x * f0 + p[0]) * 0.5 + Math.sin(x * f0 * 2.3 + p[1]) * 0.27 + Math.sin(x * f0 * 5.1 + p[2]) * 0.15 + Math.sin(x * f0 * 11.3 + p[3]) * 0.08;

function ridge(c, fn, yBase, amp, fill, step) {
  const x0 = V.x0 - 4, x1 = V.x1 + 4; step = step || 1.2;
  c.beginPath(); c.moveTo(X(x0), V.H + 2);
  for (let x = x0; x <= x1 + step; x += step) c.lineTo(X(x), Y(yBase + amp * fn(x)));

      embers = []; for (let k = 0; k < 48; k++) { const e = {}; spawnEmber(e, true); embers.push(e); }
      flakes = []; for (let k = 0; k < 12; k++) flakes.push({ x: V.x0 + R() * (V.x1 - V.x0), y: R() * V.top, v: 1.6 + R() * 1.8, w: 0.6 + R() * 0.9, p: R() * TAU, r: 0.22 + R() * 0.2 });
      bands = []; for (let k = 0; k < 5; k++) bands.push({ y: LK.y - 1 - (k + R() * 0.6) * ((LK.y - 1.4 - LAKE_D) / 5), u: R(), v: (0.03 + R() * 0.03) * (k & 1 ? 1 : -1), w: 6 + R() * 6 });
      bubs = []; for (let k = 0; k < 4; k++) bubs.push({ x: 0, y: 0, t: R(), max: 0 });
    },
    back(c, t, dt) {
      const s = V.s;
      // 火口的煙：慢慢往上、變大、變淡
      for (const k of puffs) {
        k.t += dt / k.max; if (k.t >= 1) { k.t -= 1; k.dx = (Math.random() - 0.5) * 1.6; }
        const p = k.p, f = k.t, r = k.r * (1 + f * 2.2) * s, x = X(p.x + k.dx + p.out * f * f * 5), y = Y(p.h + 0.6 + f * 11);
        c.globalAlpha = Math.sin(Math.min(1, f * 1.15) * Math.PI) * 0.85; c.drawImage(gPuff, x - r, y - r, r * 2, r * 2);
      }
      // 高空的灰雲
      for (const k of clouds) {
        k.x += k.v * dt; if (k.x > V.x1 + 2) k.x = V.x0 - k.w - 2;
        c.globalAlpha = k.a; c.drawImage(k.cv, X(k.x), Y(k.y));
      }
      c.globalCompositeOperation = 'lighter';
      // 火口的光一明一暗
      for (let k = 0; k < 2; k++) {
        const p = PK[k], r = s * (9 + 1.2 * Math.sin(t * 0.7 + k * 2.2));
        c.globalAlpha = 0.34 + 0.22 * Math.sin(t * 0.9 + k * 1.9) + 0.06 * Math.sin(t * 3.7 + k); c.drawImage(gGlow, X(p.x) - r, Y(p.h + 0.4) - r, r * 2, r * 2);
      }
      // 熔岩順著山坡往下淌：每道主流上幾顆亮點慢慢往下滑
      for (let k = 0; k < flows.length * 3; k++) {
        const pts = flows[(k / 3) | 0], f = (t * 0.045 + (k % 3) / 3 + ((k / 3) | 0) * 0.17) % 1, q = pts[Math.min(pts.length - 1, (f * 0.8 * pts.length) | 0)], r = s * (1.4 - f * 0.6);
        c.globalAlpha = Math.sin(f * Math.PI) * 0.42; c.drawImage(gDot, X(q[0]) - r * 0.6, Y(q[1]) - r * 1.3, r * 1.2, r * 2.6);
      }
      if (!gCrust) { c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; return; }
      // 熔岩湖：上方的熱氣光、湖面滑動的亮帶、冒泡，最後蓋上硬殼
      const la = LK.a, lw = LK.b - LK.a, hw = (lw / 2 + 10) * s, hh = 11 * s;
      c.globalAlpha = 0.5 + 0.2 * Math.sin(t * 1.3) + 0.08 * Math.sin(t * 4.1); c.drawImage(gHaze, X(la + lw / 2) - hw, Y(LK.y) - hh, hw * 2, hh);
      for (const b of bands) {
        b.u += b.v * dt; if (b.u > 1) b.u -= 1; else if (b.u < 0) b.u += 1;
        const w = b.w * s, h = Math.max(2, s * 0.7);
        c.globalAlpha = Math.sin(b.u * Math.PI) * 0.75; c.drawImage(gBand, X(la + 2 + b.u * (lw - 4)) - w / 2, Y(b.y) - h / 2, w, h);
      }
      c.globalAlpha = 0.2 + 0.16 * Math.sin(t * 1.1 + 1); c.drawImage(gBand, X(la + lw * 0.2), Y(LK.y - 0.6), lw * 0.6 * s, 3.6 * s);
      for (const b of bubs) {
        b.t += dt; if (b.t >= b.max) { b.t = 0; b.max = 0.7 + Math.random() * 0.9; b.y = LK.y - 0.9 - Math.random() * 4; b.x = la + 3 + Math.random() * (lw - 6); }
        const f = b.t / b.max, r = s * (0.25 + f * 0.75);
        c.globalAlpha = f < 0.7 ? 0.9 : (1 - f) * 3; c.drawImage(gDot, X(b.x) - r, Y(b.y) - r * 0.6, r * 2, r * 1.2);
      }
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      c.drawImage(gCrust, Math.round(X(gCrust._x)), Math.round(Y(gCrust._y)));
    },
    front(c, t, dt) {
      const s = V.s;
      // 慢慢落下的灰燼
      c.fillStyle = 'rgba(64,48,50,.7)'; c.beginPath();
      for (const f of flakes) {
        f.y -= f.v * dt; f.x += (Math.sin(t * f.w + f.p) * 1.2 + S.wind * 0.3) * dt;
        if (f.y < groundYRaw(f.x) - 1) { f.y = V.top + 1; f.x = V.x0 + Math.random() * (V.x1 - V.x0); }
        const px = X(f.x), py = Y(f.y), r = f.r * s, a = f.p + t * f.w * 0.7;
        c.moveTo(px + r * Math.cos(a), py + r * Math.sin(a)); c.ellipse(px, py, r, r * (0.3 + 0.35 * Math.abs(Math.sin(t * f.w * 1.3 + f.p))), a, 0, TAU);
      }
      c.fill();
      // 往上飄的火星
      c.globalCompositeOperation = 'lighter';
      for (const e of embers) {
        e.t += dt; if (e.t >= e.max) spawnEmber(e, false);
        e.y += e.vy * dt; e.x += (e.vx + Math.sin(t * 1.7 + e.p) * 1.5 + S.wind * 0.25) * dt;
        const f = e.t / e.max, r = e.r * s * (1.3 - f * 0.6);
        c.globalAlpha = (f < 0.1 ? f * 10 : 1 - (f - 0.1) / 0.9) * (0.72 + 0.28 * Math.sin(t * 8 + e.p * 5)); c.drawImage(gDot, X(e.x) - r, Y(e.y) - r, r * 2, r * 2);
      }
      c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    }
  };
})();

const PL = planck;
// 世界單位直接當公尺用（一格磚 3.4）。東西比 Box2D 預設的大、重力也大，所以把「多慢算靜止」放寬一點

const UNIT_W = 2.2, UNIT_H = 3.0, UNIT_DEN = 1.6;          // 兵的身體（一個不會倒的長方形）

const IMP_GATE = 3.5;        // 兩個東西靠近的速度超過這個才算「撞擊」
const IMP_V0 = 9, IMP_K = 0.9;          // 磚：撞擊造成的速度變化超過 V0 的部分 × K × 脆度 = 傷害
const UIMP_V0 = 11, UIMP_K = 2.3;       // 兵：摔下來、被砸到都很痛
const DV_MAX = 24;           // 爆炸最多把一塊磚加速到多快
const FRAG_MAX = 56;         // 場上最多留幾塊碎塊（超過就直接碎成粉）
const FRAG_KEEP = 34;        // 每回合結束時，最舊的碎塊清到剩這麼多
const PH = { world: null, ground: null, stamp: 0, stepId: 0, imp: [], impN: 0, inStep: false, kill: [], found: [], wm: null, ek: 0, ex: 0, ey: 0 };

/* ---------- 地面 ---------- */
// 不管有沒有地面的高度（畫圖也用這個）
function groundYRaw(x) {
  const p = S.gpts; if (!p) return 0;
  if (x <= p[0][0]) return p[0][1];
  const n = p.length; if (x >= p[n - 1][0]) return p[n - 1][1];
  for (let i = 1; i < n; i++) if (x <= p[i][0]) { const a = p[i - 1], b = p[i]; return a[1] + (b[1] - a[1]) * ((x - a[0]) / (b[0] - a[0])); }
  return 0;
}
// 沒有地面的地方回傳 -999

    case 'shieldhit': if (FX.rings.length < 30) ring(a, b, 0.4, 3.4, 0.22, c === 0 ? '#cfeaff' : '#ffc0b0', 0.4); part(P_FLASH, a, b, 0, 0, 0.1, 1.8, c === 0 ? C_SKY : C_SALMON); sfx('shieldhit'); break;
    case 'ult': ring(a, b, 3, 40, 0.5, c === 0 ? '#ffe9a0' : '#ffb0a0', 0.8); burst(P_SPARK, a, b, 16, 40, 0.7, 0.8, C_GOLD); flash(0.25, '#fff0b0'); sfx('ult'); vibrate(40); break;
    case 'ultarm': ring(a, b, 26, 4, 0.4, '#ffe9a0', 0.7); sfx('arm'); break;
    case 'ultoff': sfx('click'); break;
    case 'shieldoff': break;
    case 'skip': pop(a, b, d ? '被電暈' : '凍住了', d ? '#ffe14a' : '#bfeeff', 2.6, 1.0); break;
    case 'freeze': burst(P_SHARD, a, b, 6, 14, 0.6, 0.5, C_ICE, 6); sfx('frost'); break;
    case 'chain': {
      // a 這一輪垮了幾塊；b 誰打的
      if (b === 0) { pop(MID + 30, 30, '坍塌 ×' + a, '#ffe14a', 3.4 + Math.min(2.6, a * 0.1), 1.6); sfx('chain', Math.min(6, a / 6 | 0)); }
      break;
    }
    case 'turn': if (a === 0) sfx('turn'); break;
    case 'volley': break;
    case 'round': break;
    case 'lanternoff': burst(P_SMOKE, a, b, 3, 4, 0.5, 1.2, C_WHITE); break;
    case 'orbgo': sfx('orb'); break;
    case 'port': burst(P_SPARK, a, b, 3, 12, 0.3, 0.5, c === 0 ? C_SKY : C_SALMON); if (d === 0) sfx('port'); break;
    case 'ping': part(P_FLASH, a, b, 0, 0, 0.12, 2.6, C_ICE); burst(P_SPARK, a, b, 3, 14, 0.25, 0.4, C_ICE); sfx('ping'); break;
    case 'flak': FX.tracers.push({ x0: a, y0: b, x1: c, y1: d, t: 0, side: e }); if (f) { part(P_FLASH, c, d, 0, 0, 0.1, 1.8, C_WHITEHOT); burst(P_SMOKE, c, d, 2, 4, 0.4, 1.0, C_DARK); } sfx('flak'); break;
    case 'pop': burst(P_CONF, a, b, 16, 30, 1.0, 0.7, d === 1 ? C_RED : C_SKY, 6); burst(P_SMOKE, a, b, 4, 8, 0.6, 1.8, C_GRAY); ring(a, b, 1, 7, 0.3, '#ffffff', 0.4); pop(a, b + 4, '擊落！', '#ffe14a', 3.2, 0.9); sfx('pop'); break;
    case 'launch': burst(P_SMOKE, a, b, 4, 6, 0.6, 1.4, C_WHITE); sfx('launch'); break;
    case 'drop': sfx('drop'); break;
    case 'lantern': sfx('lantern'); break;
    case 'bonus': {
      // c 哪一邊拿到；d 種類
      const txt = d === 'heal' ? '全軍回血！' : d === 'rage' ? '怒火！下一輪打兩次' : d === 'charge' ? '技能全滿！' : '援軍到！';
      burst(P_CONF, a, b, 18, 34, 1.1, 0.7, c === 0 ? C_GOLD : C_RED, 8); ring(a, b, 1, 10, 0.4, '#fff0b0', 0.5);
      pop(a, b + 4, (c === 0 ? '' : '敵軍') + txt, c === 0 ? '#ffe14a' : '#ff8a7a', 3.4, 1.4); sfx(c === 0 ? 'bonus' : 'bad');
      break;
    }
    case 'revive': ring(a, b + 2, 6, 1, 0.5, '#bfe6ff', 0.5); burst(P_SPARK, a, b + 2, 10, 16, 0.6, 0.5, C_SKY); break;
    case 'build': part(P_DUST, a, b, 0, 3, 0.5, 2.2, C_WHITE); break;
    case 'orb': sfx('orb'); break;
    case 'orbdie': burst(P_SPARK, a, b, 22, 44, 0.7, 0.9, C_PINK); burst(P_SMOKE, a, b, 8, 12, 0.9, 2.6, C_PURPLE); ring(a, b, 1, 14, 0.45, '#ff9ad8', 0.7); pop(a, b + 5, '擊破！', '#ffe14a', 3.6, 1.0); shake(0.5); sfx('boom2'); break;
    case 'bar': part(P_FLASH, a, b, 0, 0, 0.1, 2.2, C_PINK); burst(P_SPARK, a, b, 2, 14, 0.25, 0.4, C_PINK); sfx('shieldhit'); break;
    case 'barbreak': burst(P_SHARD, a, b, 16, 36, 0.9, 0.7, C_PINK, 8); ring(a, b, 1, 10, 0.4, '#ffffff', 0.5); pop(a, b + 5, '結界破！', '#ffe14a', 3.4, 1.0); sfx('gbreak'); shake(0.3); break;
    case 'barup': sfx('gspawn'); break;
    case 'erupt': for (let k = 0; k < 12; k++) part(P_EMBER, a + rndS() * 4, b + Math.random() * 6, rndS() * 14, 24 + Math.random() * 30, 0.9, 1.0, C_ORANGE); shake(0.2); sfx('erupt'); break;
    case 'rockwarn': sfx('warn'); break;
    case 'rockstop': burst(P_DEBRIS, a, b, 10, 30, 0.8, 0.8, C_GRAY, 8); burst(P_DUST, a, b, 4, 8, 0.6, 2.4, C_SAND); pop(a, b + 4, '擋住了！', c === 0 ? '#cfe6ff' : '#ffc4b8', 3, 0.9); sfx('crumble'); break;
    case 'rumble': shake(0.5); sfx('rumble'); break;
    case 'dirt': burst(P_DUST, a, b + 0.5, 3, 10, 0.5, 1.6, C_SAND, 4); break;
    case 'tick': burst(P_SPARK, a, b, 2, 12, 0.2, 0.4, C_WHITEHOT); sfx('tick'); break;
    case 'end': {
      slowmo(0.3, 2.3, true); shake(2.0); flash(0.45, '#fff6d8'); sfx('collapse'); vibrate(200);
      ring(a, b, 2, 16, 0.6, '#fff0b0', 0.7);         // 只留一圈小的，別把整座城垮下來的樣子蓋住
      break;
    }
    case 'bossback': ring(a, b, 14, 1.5, 0.5, '#ff7ad0', 0.8); burst(P_SPARK, a, b, 18, 30, 0.7, 0.8, C_PINK); burst(P_SMOKE, a, b, 6, 8, 0.8, 2.4, C_PURPLE); pop(a, b + 7, '魔王飛回來了', '#ff9ad8', 3.4, 1.4); flash(0.3, '#ff5aa0'); sfx('dark'); break;
    case 'phase': flash(0.7, '#ff5aa0'); shake(1.6); sfx('phase'); vibrate(120); break;
    case 'sudden': flash(0.5, '#ff6a3a'); sfx('horn'); break;
    case 'wind': sfx('gust'); break;
  }
  if (typeof uiEvent === 'function') uiEvent(t, a, b, c, d, e, f);
}

    // 還沒輪到我就先按住的（開場、敵軍砲擊中）：輪到我之後才開始算「有沒有拖過」
    if (!d.live && canFire()) { d.live = true; d.x0 = d.x; d.y0 = d.y; d.far = 0; }
    d.x = e.clientX; d.y = e.clientY; d.far = Math.max(d.far, Math.hypot(d.x - d.x0, d.y - d.y0));
    const m = stageDelta(dx, dy), k = (V.dpr / V.s) * 1.5, T = S.team[0];
    simAim(0, T.aim[0] + m[0] * k, T.aim[1] - m[1] * k);
  });
  const up = (e) => {
    const d = G.drag; if (!d || d.id !== e.pointerId) return;
    G.drag = null;
    if (e.type !== 'pointerup' || !canFire()) return;
    // 真的拖過才發射（看離起點最遠拖了多遠，手指按著不動的抖動不算）
    if (d.live && d.far > 14) fireNow();
    else if (d.far <= 14 && !G.said.tap && $('hint').hidden) { G.said.tap = 1; say('按住拖曳瞄準，放開就發射；也可以按左下角的「發射」'); }
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  // 萬一沒收到放開的事件（指標捕捉被搶走、系統手勢）：別讓瞄準卡住
  stage.addEventListener('lostpointercapture', (e) => { const d = G.drag; if (d && d.id === e.pointerId) setTimeout(() => { if (G.drag === d) G.drag = null; }, 60); });
  const noTouch = (e) => { const d = G.drag; if (d && d.type === 'touch' && e.touches && e.touches.length === 0) setTimeout(() => { if (G.drag === d) G.drag = null; }, 80); };
  document.addEventListener('touchend', noTouch, { passive: true }); document.addEventListener('touchcancel', noTouch, { passive: true });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (!e.target.closest || !e.target.closest('.modal')) e.preventDefault(); }, { passive: false });
  const kbFocus = (el) => { try { return el.matches(':focus-visible'); } catch (err) { return false; } };
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;                 // 瀏覽器、系統自己的快速鍵（Ctrl+C、Alt+←…）不攔
    const play = G.mode === 'play', ae = document.activeElement, onBtn = !!ae && ae.tagName === 'BUTTON', act = e.code === 'Space' || e.code === 'Enter';
    if (act && onBtn && kbFocus(ae)) return;                        // 用 Tab 選到某顆按鈕再按 Enter／空白鍵：那是要按那顆按鈕
    G.keys[e.code] = true;
    if (play && (/^Arrow/.test(e.code) || act)) e.preventDefault();
    if (e.repeat) return;
    const pk = e.code === 'KeyP' || e.code === 'Escape';
    if (play) {
      if (act) { if (onBtn) ae.blur(); if (!fireNow()) sfx('deny'); }
      else if (e.code === 'KeyX' || e.code === 'KeyC') useSkill('ult');
      else if (e.code === 'KeyZ') useSkill('shield');
      else if (pk) pauseGame();
    } else if (G.mode === 'pause' && pk) resumeGame();
    else if (e.code === 'Escape') { for (const id of ['shop', 'opt']) if (!$(id).hidden) { $(id).hidden = true; sfx('click'); if (G.mode === 'home') homeRender(); break; } }
  });
  window.addEventListener('keyup', (e) => { G.keys[e.code] = false; });
  window.addEventListener('blur', () => { G.keys = {}; G.drag = null; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && S.state === 'play') pauseGame(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx) AU.ctx.resume(); });
  window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('app'));

  const click = (id, fn) => $(id).addEventListener('click', (e) => { auInit(); fn(e); });
  // 戰鬥中的按鈕按下去就算（不等 click）：另一根手指正在瞄準的時候，瀏覽器不會替第二根手指合成 click。
  // 鍵盤（Tab 選到再按 Enter）還是走 click；按完把焦點還回去，免得之後按空白鍵又「按」到它
  const press = (id, fn) => {
    const el = $(id); if (!window.PointerEvent) { click(id, fn); return; }
    let at = -1e9;
    el.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); e.stopPropagation(); auInit(); at = performance.now(); fn(e); el.blur(); });
    // 滑鼠、手指的那一下已經在 pointerdown 處理過；這裡只收鍵盤按的（沒有指標種類、detail 是 0）
    el.addEventListener('click', (e) => { if (e.pointerType || e.detail > 0 || performance.now() - at < 700) { el.blur(); return; } auInit(); fn(e); });
  };
  press('btnFire', () => { if (!fireNow()) sfx('deny'); });
  press('btnUlt', () => useSkill('ult'));
  press('btnShield', () => useSkill('shield'));
  press('btnPause', () => { sfx('click'); pauseGame(); });
  click('btnGo', () => { sfx('click'); startLevel(UI.sel); });
  click('btnShop', () => { sfx('click'); shopRender(); $('shop').hidden = false; });
  click('btnOpt', () => { sfx('click'); openOpt(false); });
  click('btnResume', () => { sfx('click'); resumeGame(); });
  click('btnRetry', () => { sfx('click'); startLevel(S.idx); });
  click('btnQuit', () => { sfx('click'); goHome(); });
  click('btnNext', () => { sfx('click'); UI.sel = Math.min(LEVELS.length - 1, S.idx + 1); startLevel(UI.sel); });
  click('btnAgain', () => { sfx('click'); startLevel(S.idx); });
  click('btnUp', () => { sfx('click'); shopRender(); $('shop').hidden = false; });
  click('btnHome', () => { sfx('click'); UI.sel = Math.min(S.state === 'won' ? S.idx + 1 : S.idx, SV.open - 1, LEVELS.length - 1); goHome(); });
  click('tSfx', () => { SV.sfx = !SV.sfx; toggleSync(); save(); sfx('click'); });
  click('tMus', () => { SV.mus = !SV.mus; toggleSync(); save(); sfx('click'); });
  click('tVib', () => { SV.vib = !SV.vib; toggleSync(); save(); vibrate(30); sfx('click'); });
  click('btnFlip', () => { SV.flip = !SV.flip; save(); sfx('click'); layout(); });
  document.querySelectorAll('#diffSeg button').forEach((b) => b.addEventListener('click', () => { auInit(); SV.diff = +b.dataset.d; toggleSync(); save(); sfx('click'); }));
  click('btnUnlock', () => { SV.open = LEVELS.length; save(); sfx('buy'); homeRender(); $('opt').hidden = true; });
  click('btnWipe', () => {
    if (!UI.wipeArm) { UI.wipeArm = 1; $('btnWipe').textContent = '再按一次，確定清除'; sfx('deny'); return; }
    SV.coins = 0; SV.open = 1; SV.seen = false; SV.seenUlt = false; SV.seenSh = false; SV.stars = LEVELS.map(() => 0); for (const k in SV.up) SV.up[k] = 0;
    save(); UI.sel = 0; homeRender(); demoStart(0); $('opt').hidden = true; sfx('click');
  });
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { sfx('click'); b.closest('.modal').hidden = true; if (G.mode === 'home') homeRender(); }));
  // 有視窗開著的時候，後面的東西不收鍵盤焦點（Tab 不會跑到視窗後面的按鈕去）
  const layers = ['result', 'opt', 'shop'];       // 由下到上
  const scope = () => { let top = -1; layers.forEach((id, i) => { if (!$(id).hidden) top = i; }); $('home').inert = top >= 0; $('hud').inert = top >= 0; layers.forEach((id, i) => { $(id).inert = i < top; }); };
  if (window.MutationObserver) { const mo = new MutationObserver(scope); for (const id of layers) mo.observe($(id), { attributes: true, attributeFilter: ['hidden'] }); }
}

function boot() {
  loadSave(); toggleSync();
  // 系統設了「減少動態效果」：不晃畫面、閃光壓到很淡
  const rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  if (rm) { const f = () => { FX.calm = rm.matches; }; f(); if (rm.addEventListener) rm.addEventListener('change', f); else if (rm.addListener) rm.addListener(f); }
  $('keyHelp').hidden = !(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
  UI.sel = clamp(SV.open - 1, 0, LEVELS.length - 1);
  renderInit($('cv'));
  bindInput(); homeRender();
  simInit(UI.sel, {}, 1, 1, { botA: BOTS.demo });      // 先有一局，layout 才知道要畫哪個場景
  layout(); demoStart(UI.sel);
  G.last = performance.now(); requestAnimationFrame(frame);
  // 字型晚一點才載到的話重新排一次
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); }).catch(() => { });
}
window.__qp = { SAY, HUD, say, sayClear, uiEvent, S, SH, FX, G, V, SV, AU, RD, UI, PH, LEVELS, BOTS, simInit, simStep, simAim, simFire, simSkill, aiInit, teamBar, startLevel, goHome, layout, renderFrame, fxStep, hudUpdate, sfx, musStart, physExplode, blockKill, killUnit, WPN,
  // 測試用：凍結即時迴圈後，手動把戰局往前推 sec 秒
  advance(sec) { const n = Math.round(sec / STEP); let acc = 0; for (let i = 0; i < n; i++) { simStep(STEP); fxStep(STEP, STEP); acc += STEP; if (G.mode === 'play' && S.state !== 'play') G.endT += STEP; if (acc >= 0.05 && i < n - 1) { renderFrame(acc, acc); acc = 0; } } if (G.mode === 'play') hudUpdate(); renderFrame(acc || STEP, acc || STEP); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
